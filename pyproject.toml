# SPDX-License-Identifier: MIT
# Dependencies of the scripts in scripts/, run with "uv run --locked". Not a package.

[project]
name = "portaudio-windows-builds"
version = "0.1.0"
description = "Builds and releases PortAudio DLLs for Windows"
license = "MIT"
requires-python = ">=3.15"
dependencies = ["pefile>=2024.8.26"]

[tool.ruff]
# Allow lines to be as long as 100
line-length = 100

[tool.uv]
package = false
