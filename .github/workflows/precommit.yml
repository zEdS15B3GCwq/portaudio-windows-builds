---
# Runs the prek hooks on the files a PR changes.
#
# If the hooks fix something, the pre-commit-bot app pushes the fixes to the PR branch as a new
# commit, and this run still fails, so that only a commit that passes on its own can be merged.
# Fixes aren't pushed for PRs from forks or Dependabot (their runs get no secrets), nor for
# the bot's own commits (so it can't loop). Those just fail; run prek locally to fix them.
#
# The pre-commit-bot environment holds the app's client ID (variable APP_CLIENT_ID) and private
# key (secret APP_PRIVATE_KEY). The app needs Contents and Workflows: read and write, because
# the hooks also fix workflow files. The bot's name below must match the app's slug.

name: pre-commit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  precommit:
    name: pre-commit (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      fixed: ${{ steps.fixes.outputs.fixed }}
    steps:
      # The commit the event is about, not the branch, which may have moved on since. Fork
      # commits can be fetched from this repository too. Full history for the diff with base.
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      # Hook environments depend on the runner and on the config, which includes the Python
      # version the hooks use (default_language_version). A config change restores the
      # previous environments, and prek reuses those that still match.
      - name: Cache hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: prek-${{ runner.os }}-${{ runner.arch }}-

      # Fails both when a hook fixed files and when a hook found a problem it can't fix.
      # The next steps tell the two apart.
      - name: Run hooks on changed files
        id: hooks
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          uvx prek run --show-diff-on-failure --color=always \
            --from-ref "$BASE_SHA" --to-ref HEAD

      # Only tracked files count, so caches and other tool output never end up in the commit.
      - name: Save fixes
        id: fixes
        if: steps.hooks.outcome == 'failure'
        run: |
          if git diff --quiet; then
            echo "fixed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --binary > "$RUNNER_TEMP/fixes.patch"
            echo "fixed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload fixes
        if: steps.fixes.outputs.fixed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: precommit-fixes
          path: ${{ runner.temp }}/fixes.patch
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Fail if the hooks failed
        if: steps.hooks.outcome == 'failure'
        env:
          FIXED: ${{ steps.fixes.outputs.fixed }}
        run: |
          if [ "$FIXED" = true ]; then
            echo "::error::Hooks changed files. The fixes are pushed as a new commit if possible;" \
              "otherwise run prek locally. Other problems may need fixing by hand, see above."
          else
            echo "::error::Hooks found problems that they can't fix, see above."
          fi
          exit 1

  push:
    name: Push fixes
    needs: precommit
    # Runs although precommit failed: it always does when there is something to push.
    # Does not run on forks, and on commits by dependabot or this pre-commit-bot.
    if: |-
      !cancelled() &&
      needs.precommit.outputs.fixed == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'pre-commit-bot[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pre-commit-bot
    # Everything here uses the app's token, not GITHUB_TOKEN.
    permissions: {}
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc  # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      # Commits by <slug>[bot] with this email are shown as made by the app.
      - name: Look up bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      # Credentials are kept for the push.
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Download fixes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: precommit-fixes
          path: ${{ runner.temp }}

      # The push is rejected if the branch has moved on since the checked commit. The run for
      # the newer commit will check (and fix) it.
      - name: Commit and push fixes
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GIT_AUTHOR_NAME: ${{ steps.bot.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.bot.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot.outputs.email }}
        run: |
          git apply --index "$RUNNER_TEMP/fixes.patch"
          git commit -m "[pre-commit] automatic fixes"
          git push origin "HEAD:refs/heads/${HEAD_REF}"

  build:
    name: Build
    needs: precommit
    uses: $/.github/workflows/build.yml
    with:
      force: true
    # A ceiling for build.yml's jobs, not a grant. Only its release job asks for these,
    # and it never runs in a pull request (it requires refs/heads/main).
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
